<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b5e35">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="গাছ ক্যালকুলেটর">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg">
  <title>গোল গাছ মাপার ক্যালকুলেটর</title>
  <!-- Bengali font with offline fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:      #1b5e35;
      --green-btn:  #237a43;
      --green-lt:   #e6f4eb;
      --green-pale: #f0f8f3;
      --red:        #c0392b;
      --red-pale:   #fdf0ef;
      --text:       #111;
      --muted:      #4a5a50;
      --border:     #b2d1bc;
      --bg:         #f2f7f4;
      --white:      #fff;
    }
    html, body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    body { padding-bottom: 40px; }

    .header {
      background: var(--green); color: #fff;
      text-align: center; padding: 14px 14px 12px;
    }
    .header h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }

    .section {
      background: var(--white); margin: 10px 10px 0;
      border-radius: 12px; border: 1.5px solid var(--border); overflow: hidden;
    }
    .sec-head {
      background: var(--green-pale); border-bottom: 1.5px solid var(--border);
      padding: 9px 14px; font-size: 16px; font-weight: 700; color: var(--green);
    }

    .inp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 10px 6px; }
    .field label { display: block; font-size: 17px; font-weight: 700; color: var(--green); margin-bottom: 5px; }
    .field input[type="number"] {
      width: 100%; font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 30px; font-weight: 700; color: var(--text);
      background: var(--green-pale); border: 2px solid var(--border);
      border-radius: 9px; padding: 12px 10px; outline: none;
      -webkit-appearance: none; appearance: none; text-align: center;
    }
    .field input:focus { border-color: var(--green); background: #fff; }
    .field input.err   { border-color: var(--red);   background: var(--red-pale); }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .err-msg {
      display: none; font-size: 16px; font-weight: 600; color: var(--red);
      background: var(--red-pale); border-radius: 8px; padding: 9px 12px;
      margin: 0 10px 8px; line-height: 1.4;
    }
    .err-msg.show { display: block; }

    .live-result {
      margin: 0 10px 8px; background: var(--green-lt); border-radius: 10px;
      padding: 10px 14px; display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .lr-label { font-size: 17px; font-weight: 700; color: var(--green); flex-shrink: 0; }
    .lr-value { font-size: 28px; font-weight: 700; color: var(--green); text-align: right; }
    .lr-value.muted { font-size: 17px; color: var(--muted); font-weight: 400; }

    .btn-add {
      width: calc(100% - 20px); margin: 0 10px 12px; padding: 15px 10px;
      background: var(--green-btn); color: #fff;
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 22px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .12s, transform .1s;
    }
    .btn-add:active:not(:disabled) { background: var(--green); transform: scale(.98); }
    .btn-add:disabled { background: #9cbe9c; }
    .plus-c {
      width: 30px; height: 30px; flex-shrink: 0;
      background: rgba(255,255,255,.25); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1;
    }

    .steps-wrap { max-height: 210px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .steps-wrap:empty::after {
      content: 'এখনো কোনো গাছ যোগ হয়নি'; display: block; text-align: center;
      color: var(--muted); font-size: 17px; padding: 18px;
    }
    .step-row {
      display: flex; align-items: center; padding: 9px 12px;
      border-bottom: 1px solid #dff0e6; gap: 10px; animation: pop .18s ease;
    }
    @keyframes pop { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .step-row:last-child { border-bottom: none; }
    .step-row.editing { background: #fffbe6; flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    .step-num {
      width: 30px; height: 30px; flex-shrink: 0;
      background: var(--green-lt); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--green);
    }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1 1 100%; }
    .edit-grid input {
      width: 100%; font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 24px; font-weight: 700; color: var(--text);
      background: #fff; border: 2px solid #f4d03f;
      border-radius: 8px; padding: 8px 10px; outline: none; text-align: center;
      -webkit-appearance: none; appearance: none;
    }
    .edit-grid input:focus { border-color: var(--green); }
    .edit-actions { display: flex; gap: 6px; flex: 1 1 100%; }
    .edit-save {
      flex: 1; padding: 10px; background: var(--green-btn); color: #fff;
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 18px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer;
    }
    .edit-cancel {
      flex: 1; padding: 10px; background: #fff; color: var(--muted);
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 18px; font-weight: 700; border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
    }

    .sum-row { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--border); }
    .sum-cell { padding: 10px 8px; text-align: center; }
    .sum-cell:first-child { border-right: 1px solid var(--border); }
    .sum-label { font-size: 13px; color: var(--muted); font-weight: 600; }
    .sum-val { font-size: 24px; font-weight: 700; color: var(--green); margin-top: 2px; }

    .price-wrap { padding: 10px 10px 0; }
    .price-label { font-size: 17px; font-weight: 700; color: var(--green); margin-bottom: 6px; }
    .price-input {
      width: 100%; font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 30px; font-weight: 700; color: var(--text);
      background: var(--green-pale); border: 2px solid var(--border);
      border-radius: 9px; padding: 12px 10px; outline: none; text-align: center;
      -webkit-appearance: none; appearance: none;
    }
    .price-input:focus { border-color: var(--green); background: #fff; }
    input[type=number].price-input::-webkit-inner-spin-button,
    input[type=number].price-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .final-bar {
      margin: 10px 10px 12px; background: var(--green); border-radius: 10px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .fb-label { font-size: 18px; font-weight: 700; color: rgba(255,255,255,.85); }
    .fb-value { font-size: 28px; font-weight: 700; color: #fff; }

    .btn-clear {
      width: calc(100% - 20px); margin: 10px 10px 0; padding: 15px 10px;
      background: #fff; color: var(--red);
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 20px; font-weight: 700; border: 2px solid #e8b4b0; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-clear:active { background: var(--red-pale); transform: scale(.98); }

    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; align-items:flex-end; }
    .overlay.show { display:flex; }
    .sheet { background:#fff; width:100%; border-radius:20px 20px 0 0; padding:24px 18px 40px; text-align:center; }
    .sheet h2 { font-size:22px; font-weight:700; margin-bottom:8px; }
    .sheet p  { font-size:18px; color:var(--muted); margin-bottom:22px; line-height:1.5; }
    .sheet-btns { display:flex; flex-direction:column; gap:10px; }
    .sheet-yes {
      padding:16px; background:var(--red); color:#fff;
      font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size:22px; font-weight:700; border:none; border-radius:10px; cursor:pointer;
    }
    .sheet-no {
      padding:16px; background:var(--green-pale); color:var(--green);
      font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size:22px; font-weight:700; border:2px solid var(--border); border-radius:10px; cursor:pointer;
    }

    /* install banner */
    .install-bar {
      display:none; background:#fffbe6; border-bottom:1.5px solid #f4d03f;
      padding:10px 14px; align-items:center; justify-content:space-between; gap:8px;
    }
    .install-bar.show { display:flex; }
    .install-bar span { font-size:15px; font-weight:600; color:#7d6608; flex:1; }
    .install-btn {
      padding:8px 14px; background:var(--green); color:#fff;
      font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size:15px; font-weight:700; border:none; border-radius:8px; cursor:pointer; flex-shrink:0;
    }
    .install-close { background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer; flex-shrink:0; }
  </style>
</head>
<body>

  <!-- Install prompt banner -->
  <div class="install-bar" id="installBar">
    <span>📲 হোম স্ক্রিনে ইনস্টল করুন</span>
    <button class="install-btn" id="installBtn">ইনস্টল</button>
    <button class="install-close" onclick="document.getElementById('installBar').classList.remove('show')">✕</button>
  </div>

  <div class="header">
    <h1>🌳 গোল গাছ মাপার ক্যালকুলেটর</h1>
  </div>

  <div class="section">
    <div class="sec-head">📏 গাছের মাপ দিন</div>
    <div class="inp-grid">
      <div class="field">
        <label for="inp1">বেড় (ইঞ্চি)</label>
        <input type="number" id="inp1" placeholder="০" inputmode="decimal" oninput="onInput()" autocomplete="off">
      </div>
      <div class="field">
        <label for="inp2">লম্বা (ফুট)</label>
        <input type="number" id="inp2" placeholder="০" inputmode="decimal" oninput="onInput()" autocomplete="off">
      </div>
    </div>
    <div class="err-msg" id="errMsg"></div>
    <div class="live-result">
      <span class="lr-label">কাঠের পরিমাণ</span>
      <span class="lr-value muted" id="liveVal">— ঘনফুট</span>
    </div>
    <button class="btn-add" id="addBtn" onclick="addTree()" disabled>
      <span class="plus-c">+</span> গাছটি যোগ করুন
    </button>
  </div>

  <div class="section">
    <div class="sec-head">📋 গাছের তালিকা</div>
    <div class="steps-wrap" id="stepsList"></div>
    <div class="sum-row">
      <div class="sum-cell">
        <div class="sum-label">মোট গাছ</div>
        <div class="sum-val" id="sumTrees">০</div>
      </div>
      <div class="sum-cell">
        <div class="sum-label">মোট কাঠ (ঘনফুট)</div>
        <div class="sum-val" id="sumWood">০.০০০</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-head">💵 দর হিসাব</div>
    <div class="price-wrap">
      <div class="price-label">প্রতি ঘনফুট দর (টাকা)</div>
      <input type="number" class="price-input" id="priceInp" placeholder="০" inputmode="decimal" oninput="calcPrice()" autocomplete="off">
    </div>
    <div class="final-bar">
      <span class="fb-label">মোট দাম</span>
      <span class="fb-value" id="finalVal">৳ —</span>
    </div>
  </div>

  <button class="btn-clear" onclick="askClear()">🗑️ সব মুছে নতুন শুরু করুন</button>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>নিশ্চিত করুন</h2>
      <p>সব তথ্য মুছে যাবে।<br>আবার শুরু করতে চান?</p>
      <div class="sheet-btns">
        <button class="sheet-yes" onclick="doClear()">হ্যাঁ, মুছে দিন</button>
        <button class="sheet-no"  onclick="closeSheet()">না, ফিরে যান</button>
      </div>
    </div>
  </div>

<script>
  // ── Service Worker ──
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  // ── Install prompt ──
  var deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferredPrompt=e;
    document.getElementById('installBar').classList.add('show');
  });
  document.getElementById('installBtn').addEventListener('click',function(){
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt=null;
      document.getElementById('installBar').classList.remove('show');
    });
  });
  window.addEventListener('appinstalled',function(){
    document.getElementById('installBar').classList.remove('show');
  });

  // ── Calculator logic ──
  var totalWood=0,treeCount=0,currentVal=0,hasUnsaved=false;

  function makeRowHTML(num,v1,v2,wood){
    return '<div class="step-num">'+num+'</div>'+
      '<div style="flex:1;font-size:18px;color:var(--muted);font-weight:600;">'+v1+' × '+v2+'</div>'+
      '<div style="font-size:20px;font-weight:700;color:var(--green);text-align:right;margin-right:6px;">'+parseFloat(wood).toFixed(3)+' ঘনফুট</div>'+
      '<button onclick="editTree(this)" style="flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;background:var(--green-lt);color:var(--green);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:4px;">✏️</button>'+
      '<button onclick="removeTree(this)" style="flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;background:#fdf0ef;color:#c0392b;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>';
  }

  function onInput(){
    var r1=document.getElementById('inp1').value.trim();
    var r2=document.getElementById('inp2').value.trim();
    var v1=parseFloat(r1),v2=parseFloat(r2);
    var i1=document.getElementById('inp1'),i2=document.getElementById('inp2');
    i1.classList.remove('err');i2.classList.remove('err');hideErr();
    if(r1===''&&r2===''){resetLive();return;}
    if((!isNaN(v1)&&v1<0)||(!isNaN(v2)&&v2<0)){
      if(v1<0)i1.classList.add('err');if(v2<0)i2.classList.add('err');
      showErr('⚠️ মাপ ঋণাত্মক দেওয়া যাবে না।');resetLive();return;
    }
    if(r1===''||r2===''){setLive(null,'বাকি ঘর পূরণ করুন');document.getElementById('addBtn').disabled=true;return;}
    if(isNaN(v1)||isNaN(v2)){
      if(isNaN(v1))i1.classList.add('err');if(isNaN(v2))i2.classList.add('err');
      showErr('⚠️ শুধু সংখ্যা লিখুন।');resetLive();return;
    }
    if(v1===0||v2===0){
      if(v1===0)i1.classList.add('err');if(v2===0)i2.classList.add('err');
      showErr('⚠️ বেড় বা লম্বা শূন্য হতে পারবে না।');resetLive();return;
    }
    currentVal=(v1*v1*v2)/2304;
    setLive(currentVal);hasUnsaved=true;document.getElementById('addBtn').disabled=false;
  }

  function setLive(val,ph){
    var el=document.getElementById('liveVal');
    if(val===null){el.className='lr-value muted';el.textContent=ph||'— ঘনফুট';}
    else{el.className='lr-value';el.textContent=val.toFixed(3)+' ঘনফুট';}
  }
  function resetLive(){setLive(null);currentVal=0;hasUnsaved=false;document.getElementById('addBtn').disabled=true;}
  function showErr(m){var e=document.getElementById('errMsg');e.textContent=m;e.classList.add('show');}
  function hideErr(){document.getElementById('errMsg').classList.remove('show');}

  function addTree(){
    if(!hasUnsaved||currentVal<=0)return;
    var v1=parseFloat(document.getElementById('inp1').value);
    var v2=parseFloat(document.getElementById('inp2').value);
    totalWood+=currentVal;treeCount++;
    var list=document.getElementById('stepsList');
    var row=document.createElement('div');row.className='step-row';
    row.dataset.wood=currentVal;row.dataset.v1=v1;row.dataset.v2=v2;
    row.innerHTML=makeRowHTML(treeCount,v1,v2,currentVal);
    list.appendChild(row);list.scrollTop=list.scrollHeight;
    document.getElementById('sumTrees').textContent=treeCount;
    document.getElementById('sumWood').textContent=totalWood.toFixed(3);
    document.getElementById('inp1').value='';document.getElementById('inp2').value='';
    document.getElementById('inp1').classList.remove('err');document.getElementById('inp2').classList.remove('err');
    hideErr();resetLive();document.getElementById('inp1').focus();calcPrice();
  }

  function editTree(btn){
    var row=btn.closest('.step-row');
    if(row.classList.contains('editing'))return;
    var oldV1=row.dataset.v1,oldV2=row.dataset.v2,oldWood=row.dataset.wood;
    var num=row.querySelector('.step-num').textContent;
    row.classList.add('editing');
    row.innerHTML=
      '<div class="step-num">'+num+'</div>'+
      '<div class="edit-grid">'+
        '<input type="number" class="e-bed" value="'+oldV1+'" placeholder="বেড়" inputmode="decimal" autocomplete="off">'+
        '<input type="number" class="e-lom" value="'+oldV2+'" placeholder="লম্বা" inputmode="decimal" autocomplete="off">'+
      '</div>'+
      '<div class="edit-actions">'+
        '<button class="edit-save" onclick="saveEdit(this)">✔ সেভ করুন</button>'+
        '<button class="edit-cancel" onclick="cancelEdit(this,\''+oldV1+'\',\''+oldV2+'\','+oldWood+')">বাতিল</button>'+
      '</div>';
    row.querySelector('.e-bed').focus();
  }

  function saveEdit(btn){
    var row=btn.closest('.step-row');
    var v1=parseFloat(row.querySelector('.e-bed').value);
    var v2=parseFloat(row.querySelector('.e-lom').value);
    if(isNaN(v1)||isNaN(v2)||v1<=0||v2<=0){
      row.querySelector('.e-bed').style.borderColor='var(--red)';
      row.querySelector('.e-lom').style.borderColor='var(--red)';return;
    }
    var oldWood=parseFloat(row.dataset.wood);
    var newWood=(v1*v1*v2)/2304;
    totalWood=totalWood-oldWood+newWood;
    row.dataset.wood=newWood;row.dataset.v1=v1;row.dataset.v2=v2;
    var num=row.querySelector('.step-num').textContent;
    row.classList.remove('editing');
    row.innerHTML=makeRowHTML(num,v1,v2,newWood);
    document.getElementById('sumWood').textContent=totalWood.toFixed(3);calcPrice();
  }

  function cancelEdit(btn,oldV1,oldV2,oldWood){
    var row=btn.closest('.step-row');
    var num=row.querySelector('.step-num').textContent;
    row.classList.remove('editing');
    row.dataset.wood=oldWood;row.dataset.v1=oldV1;row.dataset.v2=oldV2;
    row.innerHTML=makeRowHTML(num,oldV1,oldV2,oldWood);
  }

  function removeTree(btn){
    var row=btn.closest('.step-row');
    totalWood-=parseFloat(row.dataset.wood);treeCount--;
    row.remove();
    document.getElementById('stepsList').querySelectorAll('.step-row').forEach(function(r,i){r.querySelector('.step-num').textContent=i+1;});
    document.getElementById('sumTrees').textContent=treeCount;
    document.getElementById('sumWood').textContent=totalWood.toFixed(3);calcPrice();
  }

  function calcPrice(){
    var p=parseFloat(document.getElementById('priceInp').value);
    var el=document.getElementById('finalVal');
    if(!isNaN(p)&&p>0&&totalWood>0){
      el.textContent='৳ '+(totalWood*p).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    }else{el.textContent='৳ —';}
  }

  function askClear(){if(treeCount===0)return;document.getElementById('overlay').classList.add('show');}
  function closeSheet(){document.getElementById('overlay').classList.remove('show');}
  function doClear(){
    totalWood=0;treeCount=0;currentVal=0;hasUnsaved=false;
    ['inp1','inp2','priceInp'].forEach(function(id){var el=document.getElementById(id);el.value='';el.classList.remove('err');});
    hideErr();resetLive();
    document.getElementById('stepsList').innerHTML='';
    document.getElementById('sumTrees').textContent='০';
