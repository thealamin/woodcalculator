<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="গাছ ক্যালকুলেটর">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg">
  <title>গোল গাছ মাপার ক্যালকুলেটর</title>
  <!-- Bengali font with offline fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1d4ed8;
      --green-btn: #2563eb;
      --green-lt: #dbeafe;
      --green-pale: #eff6ff;
      --red: #dc2626;
      --red-pale: #fef2f2;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --bg: #f8fafc;
      --white: rgba(255, 255, 255, 0.86);
      --surface-solid: #ffffff;
      --focus: #3b82f6;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.12);
      --radius: 16px;
      --radius-sm: 12px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
    }
    [data-theme="dark"] {
      --green: #60a5fa;
      --green-btn: #3b82f6;
      --green-lt: #1e3a8a;
      --green-pale: #1e293b;
      --red: #f87171;
      --red-pale: #450a0a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --bg: #020617;
      --white: rgba(15, 23, 42, 0.74);
      --surface-solid: #0f172a;
      --focus: #60a5fa;
      --shadow-sm: 0 4px 12px rgba(2, 6, 23, 0.4);
      --shadow-md: 0 14px 36px rgba(2, 6, 23, 0.5);
    }
    html, body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif;
      background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.2), transparent 42%), var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      scroll-behavior: smooth;
    }
    body { padding: 0 0 var(--space-4); min-height: 100vh; transition: background .25s ease, color .25s ease; }
    button, input { transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .15s ease, color .2s ease; }
    button, input, .install-close { min-height: 44px; }
    button:focus-visible, input:focus-visible, .install-close:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .app { padding: 0 var(--space-1); }

    .header {
      background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
      color: #fff;
      padding: 14px;
      margin: 10px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 10px;
      z-index: 5;
      backdrop-filter: blur(8px);
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header h1 { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: left; }
    .theme-toggle {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      min-width: 104px;
      min-height: 44px;
    }
    .theme-toggle:active { transform: scale(.98); }

    .section {
      background: var(--white);
      margin: 0 2px var(--space-2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .sec-head {
      background: linear-gradient(120deg, rgba(37, 99, 235, 0.16), transparent);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
    }

    .inp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-1); padding: var(--space-2) var(--space-2) var(--space-1); }
    .field { position: relative; }
    .input-shell { position: relative; }
    .input-shell label {
      position: absolute;
      left: 12px;
      top: 14px;
      padding: 0 6px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      pointer-events: none;
      transition: transform .18s ease, top .18s ease, color .18s ease, background .18s ease;
    }
    .input-shell input:focus + label,
    .input-shell input:not(:placeholder-shown) + label {
      top: -10px;
      background: var(--surface-solid);
      color: var(--green);
    }
    .field input[type="number"] {
      width: 100%; font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 28px; font-weight: 700; color: var(--text);
      background: var(--green-pale); border: 2px solid var(--border);
      border-radius: var(--radius-sm); padding: 15px 10px 11px; outline: none;
      -webkit-appearance: none; appearance: none; text-align: center;
    }
    .field input:focus { border-color: var(--green); background: var(--surface-solid); box-shadow: 0 0 0 4px rgba(59, 130, 246, .18); }
    .field input.err   { border-color: var(--red);   background: var(--red-pale); }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .err-msg {
      display: none; font-size: 16px; font-weight: 600; color: var(--red);
      background: var(--red-pale); border-radius: var(--radius-sm); padding: 10px 12px;
      margin: 0 var(--space-2) var(--space-1); line-height: 1.4; border: 1px solid rgba(220, 38, 38, .35);
    }
    .err-msg.show { display: block; }

    .live-result {
      margin: 0 var(--space-2) var(--space-1);
      background: linear-gradient(90deg, var(--green-lt), rgba(147, 197, 253, .35));
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 12px 14px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .lr-label { font-size: 17px; font-weight: 700; color: var(--green); flex-shrink: 0; }
    .lr-value { font-size: 28px; font-weight: 700; color: var(--green); text-align: right; }
    .lr-value.muted { font-size: 17px; color: var(--muted); font-weight: 400; }

    .btn-add {
      width: calc(100% - 32px);
      margin: 0 var(--space-2) var(--space-2);
      padding: 14px 10px;
      background: linear-gradient(135deg, var(--green-btn), #0ea5e9);
      color: #fff;
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 22px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .btn-add::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.36);
      transform: scale(1);
      opacity: 0;
    }
    .btn-add:active:not(:disabled)::before { opacity: 1; transform: scale(18); transition: transform .35s ease, opacity .35s ease; }
    .btn-add:active:not(:disabled) { transform: translateY(1px) scale(.99); }
    .btn-add:disabled { background: #94a3b8; box-shadow: none; }
    .btn-add.ready { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{box-shadow: var(--shadow-sm)} 50%{box-shadow: 0 0 0 8px rgba(59, 130, 246, .18), var(--shadow-sm)} }
    .plus-c {
      width: 30px; height: 30px; flex-shrink: 0;
      background: rgba(255,255,255,.25); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1;
    }

    .steps-wrap { max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .steps-wrap:empty::after {
      content: 'এখনো কোনো গাছ যোগ হয়নি'; display: block; text-align: center;
      color: var(--muted); font-size: 17px; padding: 18px;
    }
    .step-row {
      display: flex; align-items: center; padding: 10px 12px;
      border-bottom: 1px solid var(--border); gap: 10px; animation: pop .18s ease;
    }
    @keyframes pop { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .step-row:last-child { border-bottom: none; }
    .step-row.editing { background: #fef9c3; flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    [data-theme="dark"] .step-row.editing { background: rgba(146, 64, 14, .35); }
    .step-num {
      width: 30px; height: 30px; flex-shrink: 0;
      background: var(--green-lt); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--green);
    }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1 1 100%; }
    .edit-grid input {
      width: 100%; font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 24px; font-weight: 700; color: var(--text);
      background: var(--surface-solid); border: 2px solid #f4d03f;
      border-radius: 8px; padding: 8px 10px; outline: none; text-align: center;
      -webkit-appearance: none; appearance: none;
    }
    .edit-grid input:focus { border-color: var(--green); }
    .edit-actions { display: flex; gap: 6px; flex: 1 1 100%; }
    .edit-save {
      flex: 1; padding: 10px; background: var(--green-btn); color: #fff;
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 18px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer;
    }
    .edit-cancel {
      flex: 1; padding: 10px; background: var(--surface-solid); color: var(--muted);
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 18px; font-weight: 700; border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
    }

    .sum-row { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); background: rgba(219, 234, 254, .35); }
    [data-theme="dark"] .sum-row { background: rgba(30, 58, 138, .35); }
    .sum-cell { padding: 12px 8px; text-align: center; }
    .sum-cell:first-child { border-right: 1px solid var(--border); }
    .sum-label { font-size: 13px; color: var(--muted); font-weight: 600; }
    .sum-val { font-size: 24px; font-weight: 700; color: var(--green); margin-top: 2px; }

    .price-wrap { padding: 16px 16px 0; }
    .price-shell { position: relative; }
    .price-label {
      position: absolute;
      left: 12px;
      top: 14px;
      padding: 0 6px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      pointer-events: none;
      transition: transform .18s ease, top .18s ease, color .18s ease, background .18s ease;
    }
    .price-input {
      width: 100%; font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 28px; font-weight: 700; color: var(--text);
      background: var(--green-pale); border: 2px solid var(--border);
      border-radius: var(--radius-sm); padding: 15px 10px 11px; outline: none; text-align: center;
      -webkit-appearance: none; appearance: none;
    }
    .price-input:focus,
    .price-input:not(:placeholder-shown) { border-color: var(--green); background: var(--surface-solid); }
    .price-input:focus + .price-label,
    .price-input:not(:placeholder-shown) + .price-label { top: -10px; background: var(--surface-solid); color: var(--green); }
    input[type=number].price-input::-webkit-inner-spin-button,
    input[type=number].price-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .final-bar {
      margin: 10px 16px 16px;
      background: linear-gradient(135deg, var(--green-btn), #0ea5e9);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .fb-label { font-size: 18px; font-weight: 700; color: rgba(255,255,255,.85); }
    .fb-value { font-size: 28px; font-weight: 700; color: #fff; }

    .btn-clear {
      width: calc(100% - 20px); margin: 10px 10px 0; padding: 15px 10px;
      background: var(--surface-solid); color: var(--red);
      font-family: 'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size: 20px; font-weight: 700; border: 2px solid rgba(220, 38, 38, .32); border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .btn-clear:active { background: var(--red-pale); transform: scale(.98); }

    .overlay { display:none; position:fixed; inset:0; background:rgba(2,6,23,.6); z-index:100; align-items:flex-end; backdrop-filter: blur(2px); }
    .overlay.show { display:flex; }
    .sheet { background:var(--surface-solid); width:100%; border-radius:20px 20px 0 0; padding:24px 18px 40px; text-align:center; border-top:1px solid var(--border); }
    .sheet h2 { font-size:22px; font-weight:700; margin-bottom:8px; }
    .sheet p  { font-size:18px; color:var(--muted); margin-bottom:22px; line-height:1.5; }
    .sheet-btns { display:flex; flex-direction:column; gap:10px; }
    .sheet-yes {
      padding:16px; background:var(--red); color:#fff;
      font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size:22px; font-weight:700; border:none; border-radius:10px; cursor:pointer;
    }
    .sheet-no {
      padding:16px; background:var(--green-pale); color:var(--green);
      font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size:22px; font-weight:700; border:2px solid var(--border); border-radius:10px; cursor:pointer;
    }

    /* install banner */
    .install-bar {
      display:none; background:#fef9c3; border-bottom:1px solid #f4d03f;
      padding:10px 14px; align-items:center; justify-content:space-between; gap:8px; margin: 0 10px; border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    }
    [data-theme="dark"] .install-bar { background: #1f2937; border-bottom-color: #475569; }
    .install-bar.show { display:flex; }
    .install-bar span { font-size:15px; font-weight:600; color:#7d6608; flex:1; }
    [data-theme="dark"] .install-bar span { color: #fbbf24; }
    .install-btn {
      padding:8px 14px; background:var(--green); color:#fff;
      font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;
      font-size:15px; font-weight:700; border:none; border-radius:8px; cursor:pointer; flex-shrink:0;
    }
    .install-close { background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer; flex-shrink:0; min-width: 44px; }
    @media (max-width: 390px) {
      .inp-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Install prompt banner -->
  <div class="install-bar" id="installBar">
    <span>📲 হোম স্ক্রিনে ইনস্টল করুন</span>
    <button class="install-btn" id="installBtn">ইনস্টল</button>
    <button class="install-close" onclick="document.getElementById('installBar').classList.remove('show')">✕</button>
  </div>

  <div class="header">
    <div class="header-row">
      <h1>🌳 গোল গাছ মাপার ক্যালকুলেটর</h1>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="থিম পরিবর্তন">
        <span id="themeIcon">🌙</span>
        <span id="themeText">ডার্ক</span>
      </button>
    </div>
  </div>

  <main class="app">
  <div class="section">
    <div class="sec-head">📏 গাছের মাপ দিন</div>
    <div class="inp-grid">
      <div class="field">
        <div class="input-shell">
          <input type="number" id="inp1" placeholder=" " inputmode="decimal" oninput="onInput()" autocomplete="off">
          <label for="inp1">বেড় (ইঞ্চি)</label>
        </div>
      </div>
      <div class="field">
        <div class="input-shell">
          <input type="number" id="inp2" placeholder=" " inputmode="decimal" oninput="onInput()" autocomplete="off">
          <label for="inp2">লম্বা (ফুট)</label>
        </div>
      </div>
    </div>
    <div class="err-msg" id="errMsg"></div>
    <div class="live-result">
      <span class="lr-label">কাঠের পরিমাণ</span>
      <span class="lr-value muted" id="liveVal">— ঘনফুট</span>
    </div>
    <button class="btn-add" id="addBtn" onclick="addTree()" disabled>
      <span class="plus-c">+</span> গাছটি যোগ করুন
    </button>
  </div>

  <div class="section">
    <div class="sec-head">📋 গাছের তালিকা</div>
    <div class="steps-wrap" id="stepsList"></div>
    <div class="sum-row">
      <div class="sum-cell">
        <div class="sum-label">মোট গাছ</div>
        <div class="sum-val" id="sumTrees">০</div>
      </div>
      <div class="sum-cell">
        <div class="sum-label">মোট কাঠ (ঘনফুট)</div>
        <div class="sum-val" id="sumWood">০.০০০</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-head">💵 দর হিসাব</div>
    <div class="price-wrap">
      <div class="price-shell">
        <input type="number" class="price-input" id="priceInp" placeholder=" " inputmode="decimal" oninput="calcPrice()" autocomplete="off">
        <label class="price-label" for="priceInp">প্রতি ঘনফুট দর (টাকা)</label>
      </div>
    </div>
    <div class="final-bar">
      <span class="fb-label">মোট দাম</span>
      <span class="fb-value" id="finalVal">৳ —</span>
    </div>
  </div>

  <button class="btn-clear" onclick="askClear()">🗑️ সব মুছে নতুন শুরু করুন</button>
  </main>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>নিশ্চিত করুন</h2>
      <p>সব তথ্য মুছে যাবে।<br>আবার শুরু করতে চান?</p>
      <div class="sheet-btns">
        <button class="sheet-yes" onclick="doClear()">হ্যাঁ, মুছে দিন</button>
        <button class="sheet-no"  onclick="closeSheet()">না, ফিরে যান</button>
      </div>
    </div>
  </div>

<script>
  // ── Service Worker ──
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  // ── Install prompt ──
  var deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferredPrompt=e;
    document.getElementById('installBar').classList.add('show');
  });
  document.getElementById('installBtn').addEventListener('click',function(){
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt=null;
      document.getElementById('installBar').classList.remove('show');
    });
  });
  window.addEventListener('appinstalled',function(){
    document.getElementById('installBar').classList.remove('show');
  });

  // ── Theme mode ──
  var themeColors={light:'#1d4ed8',dark:'#0f172a'};
  function setTheme(theme){
    var resolved=theme==='dark'?'dark':'light';
    document.documentElement.setAttribute('data-theme',resolved);
    try{localStorage.setItem('woodcalc-theme',resolved);}catch(_){}
    document.getElementById('themeIcon').textContent=resolved==='dark'?'☀️':'🌙';
    document.getElementById('themeText').textContent=resolved==='dark'?'লাইট':'ডার্ক';
    var themeMeta=document.querySelector('meta[name="theme-color"]');
    if(themeMeta)themeMeta.setAttribute('content',themeColors[resolved]);
  }
  (function initTheme(){
    var saved=null;
    try{saved=localStorage.getItem('woodcalc-theme');}catch(_){}
    if(saved!=='dark'&&saved!=='light'){
      saved=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    }
    setTheme(saved);
  })();
  document.getElementById('themeToggle').addEventListener('click',function(){
    setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });

  // ── Calculator logic ──
  var totalWood=0,treeCount=0,currentVal=0,hasUnsaved=false;

  function makeRowHTML(num,v1,v2,wood){
    return '<div class="step-num">'+num+'</div>'+
      '<div style="flex:1;font-size:18px;color:var(--muted);font-weight:600;">'+v1+' × '+v2+'</div>'+
      '<div style="font-size:20px;font-weight:700;color:var(--green);text-align:right;margin-right:6px;">'+parseFloat(wood).toFixed(3)+' ঘনফুট</div>'+
      '<button onclick="editTree(this)" style="flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--green-lt);color:var(--green);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:4px;">✏️</button>'+
      '<button onclick="removeTree(this)" style="flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid rgba(220,38,38,.25);background:var(--red-pale);color:var(--red);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>';
  }

  function onInput(){
    var r1=document.getElementById('inp1').value.trim();
    var r2=document.getElementById('inp2').value.trim();
    var v1=parseFloat(r1),v2=parseFloat(r2);
    var i1=document.getElementById('inp1'),i2=document.getElementById('inp2');
    i1.classList.remove('err');i2.classList.remove('err');hideErr();
    if(r1===''&&r2===''){resetLive();return;}
    if((!isNaN(v1)&&v1<0)||(!isNaN(v2)&&v2<0)){
      if(v1<0)i1.classList.add('err');if(v2<0)i2.classList.add('err');
      showErr('⚠️ মাপ ঋণাত্মক দেওয়া যাবে না।');resetLive();return;
    }
    if(r1===''||r2===''){setLive(null,'বাকি ঘর পূরণ করুন');var waitingBtn=document.getElementById('addBtn');waitingBtn.disabled=true;waitingBtn.classList.remove('ready');return;}
    if(isNaN(v1)||isNaN(v2)){
      if(isNaN(v1))i1.classList.add('err');if(isNaN(v2))i2.classList.add('err');
      showErr('⚠️ শুধু সংখ্যা লিখুন।');resetLive();return;
    }
    if(v1===0||v2===0){
      if(v1===0)i1.classList.add('err');if(v2===0)i2.classList.add('err');
      showErr('⚠️ বেড় বা লম্বা শূন্য হতে পারবে না।');resetLive();return;
    }
    currentVal=(v1*v1*v2)/2304;
    setLive(currentVal);hasUnsaved=true;
    var addBtn=document.getElementById('addBtn');
    addBtn.disabled=false;
    addBtn.classList.add('ready');
  }

  function setLive(val,ph){
    var el=document.getElementById('liveVal');
    if(val===null){el.className='lr-value muted';el.textContent=ph||'— ঘনফুট';}
    else{el.className='lr-value';el.textContent=val.toFixed(3)+' ঘনফুট';}
  }
  function resetLive(){
    setLive(null);currentVal=0;hasUnsaved=false;
    var addBtn=document.getElementById('addBtn');
    addBtn.disabled=true;
    addBtn.classList.remove('ready');
  }
  function showErr(m){var e=document.getElementById('errMsg');e.textContent=m;e.classList.add('show');}
  function hideErr(){document.getElementById('errMsg').classList.remove('show');}

  function addTree(){
    if(!hasUnsaved||currentVal<=0)return;
    var v1=parseFloat(document.getElementById('inp1').value);
    var v2=parseFloat(document.getElementById('inp2').value);
    totalWood+=currentVal;treeCount++;
    var list=document.getElementById('stepsList');
    var row=document.createElement('div');row.className='step-row';
    row.dataset.wood=currentVal;row.dataset.v1=v1;row.dataset.v2=v2;
    row.innerHTML=makeRowHTML(treeCount,v1,v2,currentVal);
    list.appendChild(row);list.scrollTop=list.scrollHeight;
    document.getElementById('sumTrees').textContent=treeCount;
    document.getElementById('sumWood').textContent=totalWood.toFixed(3);
    document.getElementById('inp1').value='';document.getElementById('inp2').value='';
    document.getElementById('inp1').classList.remove('err');document.getElementById('inp2').classList.remove('err');
    hideErr();resetLive();document.getElementById('inp1').focus();calcPrice();
  }

  function editTree(btn){
    var row=btn.closest('.step-row');
    if(row.classList.contains('editing'))return;
    var oldV1=row.dataset.v1,oldV2=row.dataset.v2,oldWood=row.dataset.wood;
    var num=row.querySelector('.step-num').textContent;
    row.classList.add('editing');
    row.innerHTML=
      '<div class="step-num">'+num+'</div>'+
      '<div class="edit-grid">'+
        '<input type="number" class="e-bed" value="'+oldV1+'" placeholder="বেড়" inputmode="decimal" autocomplete="off">'+
        '<input type="number" class="e-lom" value="'+oldV2+'" placeholder="লম্বা" inputmode="decimal" autocomplete="off">'+
      '</div>'+
      '<div class="edit-actions">'+
        '<button class="edit-save" onclick="saveEdit(this)">✔ সেভ করুন</button>'+
        '<button class="edit-cancel" onclick="cancelEdit(this,\''+oldV1+'\',\''+oldV2+'\','+oldWood+')">বাতিল</button>'+
      '</div>';
    row.querySelector('.e-bed').focus();
  }

  function saveEdit(btn){
    var row=btn.closest('.step-row');
    var v1=parseFloat(row.querySelector('.e-bed').value);
    var v2=parseFloat(row.querySelector('.e-lom').value);
    if(isNaN(v1)||isNaN(v2)||v1<=0||v2<=0){
      row.querySelector('.e-bed').style.borderColor='var(--red)';
      row.querySelector('.e-lom').style.borderColor='var(--red)';return;
    }
    var oldWood=parseFloat(row.dataset.wood);
    var newWood=(v1*v1*v2)/2304;
    totalWood=totalWood-oldWood+newWood;
    row.dataset.wood=newWood;row.dataset.v1=v1;row.dataset.v2=v2;
    var num=row.querySelector('.step-num').textContent;
    row.classList.remove('editing');
    row.innerHTML=makeRowHTML(num,v1,v2,newWood);
    document.getElementById('sumWood').textContent=totalWood.toFixed(3);calcPrice();
  }

  function cancelEdit(btn,oldV1,oldV2,oldWood){
    var row=btn.closest('.step-row');
    var num=row.querySelector('.step-num').textContent;
    row.classList.remove('editing');
    row.dataset.wood=oldWood;row.dataset.v1=oldV1;row.dataset.v2=oldV2;
    row.innerHTML=makeRowHTML(num,oldV1,oldV2,oldWood);
  }

  function removeTree(btn){
    var row=btn.closest('.step-row');
    totalWood-=parseFloat(row.dataset.wood);treeCount--;
    row.remove();
    document.getElementById('stepsList').querySelectorAll('.step-row').forEach(function(r,i){r.querySelector('.step-num').textContent=i+1;});
    document.getElementById('sumTrees').textContent=treeCount;
    document.getElementById('sumWood').textContent=totalWood.toFixed(3);calcPrice();
  }

  function calcPrice(){
    var p=parseFloat(document.getElementById('priceInp').value);
    var el=document.getElementById('finalVal');
    if(!isNaN(p)&&p>0&&totalWood>0){
      el.textContent='৳ '+(totalWood*p).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    }else{el.textContent='৳ —';}
  }

  function askClear(){if(treeCount===0)return;document.getElementById('overlay').classList.add('show');}
  function closeSheet(){document.getElementById('overlay').classList.remove('show');}
  function doClear(){
    totalWood=0;treeCount=0;currentVal=0;hasUnsaved=false;
    ['inp1','inp2','priceInp'].forEach(function(id){var el=document.getElementById(id);el.value='';el.classList.remove('err');});
    hideErr();resetLive();
    document.getElementById('stepsList').innerHTML='';
    document.getElementById('sumTrees').textContent='০';
    document.getElementById('sumWood').textContent='০.০০০';
    document.getElementById('finalVal').textContent='৳ —';
    closeSheet();
  }
</script>
</body>
</html>
